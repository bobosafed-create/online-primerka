name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run unit and SQLite integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate dependency environment
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q main.py worker.py scripts tests

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styleglobe
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: styleglobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgresql://styleglobe:integration-only-password@127.0.0.1:5432/styleglobe_test
          ALLOW_POSTGRES_TEST_RESET: "1"
        run: python -m unittest discover -s tests -p "test_postgres_integration.py" -v
